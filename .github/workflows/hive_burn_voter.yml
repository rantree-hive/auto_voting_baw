name: Hive Burn Post Voter

on:
  schedule:
    # Edit this line to change the run time. Format: 'MINUTE HOUR * * *' (UTC)
    # Examples: '50 23 * * *' = 23:50 UTC · '0 17 * * *' = 17:00 UTC
    - cron: '50 23 * * *'

  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  vote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run voter script
        env:
          # ── Voter config (override via secrets or leave defaults in the script)
          TARGET_AUTHOR:    ${{ secrets.TARGET_AUTHOR }}
          MIN_VOTING_POWER: ${{ secrets.MIN_VOTING_POWER }}
          VOTE_WEIGHT:      ${{ secrets.VOTE_WEIGHT }}
          HOURS_BACK:       ${{ secrets.HOURS_BACK }}
          DELAY_BETWEEN_VOTES:    3000
          DELAY_BETWEEN_ACCOUNTS: 5000

          # ── Account 1 ─────────────────────────────────────────────────────────
          ACCOUNT_1_USERNAME:    ${{ secrets.ACCOUNT_1_USERNAME }}
          ACCOUNT_1_POSTING_KEY: ${{ secrets.ACCOUNT_1_POSTING_KEY }}
          ACCOUNT_1_VOTE_POST:   ${{ secrets.ACCOUNT_1_VOTE_POST }}

          # ── Account 2 ─────────────────────────────────────────────────────────
          ACCOUNT_2_USERNAME:    ${{ secrets.ACCOUNT_2_USERNAME }}
          ACCOUNT_2_POSTING_KEY: ${{ secrets.ACCOUNT_2_POSTING_KEY }}
          ACCOUNT_2_VOTE_POST:   ${{ secrets.ACCOUNT_2_VOTE_POST }}

          # ── Account 3+ (uncomment and add secrets as needed) ──────────────────
          # ACCOUNT_3_USERNAME:    ${{ secrets.ACCOUNT_3_USERNAME }}
          # ACCOUNT_3_POSTING_KEY: ${{ secrets.ACCOUNT_3_POSTING_KEY }}
          # ACCOUNT_3_VOTE_POST:   ${{ secrets.ACCOUNT_3_VOTE_POST }}

        run: node hive_burn_voter.js --run-once
