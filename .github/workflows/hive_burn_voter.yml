name: Hive Burn Post Voter

on:
  schedule:
    # Runs every day at 23:50 UTC
    - cron: '50 23 * * *'

  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  vote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run voter script
        env:
          TARGET_AUTHOR: buildawhale
          MIN_VOTING_POWER: 8000
          VOTE_WEIGHT: 10000
          HOURS_BACK: 24
          DELAY_BETWEEN_VOTES: 3000
          DELAY_BETWEEN_ACCOUNTS: 5000

          # Account 1 — post + comments
          ACCOUNT_1_USERNAME: ${{ secrets.ACCOUNT_1_USERNAME }}
          ACCOUNT_1_POSTING_KEY: ${{ secrets.ACCOUNT_1_POSTING_KEY }}
          ACCOUNT_1_VOTE_POST: "true"

          # Account 2 — comments only
          ACCOUNT_2_USERNAME: ${{ secrets.ACCOUNT_2_USERNAME }}
          ACCOUNT_2_POSTING_KEY: ${{ secrets.ACCOUNT_2_POSTING_KEY }}
          ACCOUNT_2_VOTE_POST: "false"

          # Account 3 — add more as needed (remove if unused)
          # ACCOUNT_3_USERNAME: ${{ secrets.ACCOUNT_3_USERNAME }}
          # ACCOUNT_3_POSTING_KEY: ${{ secrets.ACCOUNT_3_POSTING_KEY }}
          # ACCOUNT_3_VOTE_POST: "true"

        run: node hive_burn_voter.js --run-once
